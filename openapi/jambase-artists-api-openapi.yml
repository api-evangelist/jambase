openapi: 3.2.0
info:
  description: REST API for concerts, festivals, artists, and venues featuring normalized data from JamBase.
  version: 3.1.0
  title: JamBase Concert Data Artists API
  contact:
    email: developer@jambase.com
    name: Team JamBase
    url: /contact
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: https://www.jambase.com/terms
  summary: REST API for live music data from JamBase
servers:
- url: https://api.data.jambase.com/v3
  description: JamBase Concert Data API
security:
- BearerAuth: []
tags:
- name: Artists
  description: Search Artists
paths:
  /artists:
    get:
      tags:
      - Artists
      summary: Search Artists
      operationId: searchArtists
      description: 'Search artists by name and genre.


        > #### Requirement

        > Your request must include at least one of the `artistName` or `genreSlug` parameters.'
      parameters:
      - $ref: '#/components/parameters/pageParam'
      - $ref: '#/components/parameters/perPageParam'
      - $ref: '#/components/parameters/artistIdParam'
      - $ref: '#/components/parameters/artistNameParam'
      - $ref: '#/components/parameters/genreSlugParam'
      - in: query
        name: artistHasUpcomingEvents
        description: Set to true to only return artists that have at least one upcoming Concert or Festival
        schema:
          type: boolean
      - $ref: '#/components/parameters/dateModifiedFromParam'
      - $ref: '#/components/parameters/datePublishedFromParam'
      - $ref: '#/components/parameters/expandExternalIdentifiersParam'
      - $ref: '#/components/parameters/expandArtistSameAsParam'
      responses:
        '200':
          $ref: '#/components/responses/searchArtistsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /artists/id/{artistDataSource}:{artistId}:
    get:
      tags:
      - Artists
      summary: Look up an artist by ID
      operationId: getSingleArtist
      description: Retrieve a single artist by JamBase ID — or directly by a third-party ID (MusicBrainz, Spotify, Ticketmaster, and more) with no ID-mapping step.
      parameters:
      - in: path
        name: artistDataSource
        description: the ArtistDataSource of the ID for the artist
        required: true
        schema:
          $ref: '#/components/schemas/enumArtistDataSource'
      - in: path
        name: artistId
        description: the unique ID for the artist
        required: true
        schema:
          type: string
      - in: query
        name: expandUpcomingEvents
        description: Use `true` to include the `event` node with any upcoming events for the artist.
        schema:
          type: boolean
          default: false
      - in: query
        name: expandUpcomingStreams
        description: Use `true` to include the `event` node with any upcoming Streams for the venue.
        schema:
          type: boolean
          default: false
      - $ref: '#/components/parameters/excludeEventPerformersParam'
      - $ref: '#/components/parameters/expandExternalIdentifiersParam'
      - $ref: '#/components/parameters/expandArtistSameAsParam'
      - $ref: '#/components/parameters/expandPastEventsParam'
      responses:
        '200':
          $ref: '#/components/responses/getSingleArtistResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
components:
  schemas:
    Thing:
      title: Thing
      description: A generic thing
      type: object
      properties:
        name:
          type: string
          description: The name of the item
        identifier:
          type: string
          example: jambase:194164
          description: A unique identifier of the item
        url:
          type: string
          format: uri
          description: URL of the item
        image:
          type: string
          format: uri
          description: 'An image of the item.\

            \

            Please note that ''image'' may not be provided for all Schemas that include `Thing` (e.g. `Organization`)

            '
        sameAs:
          type: array
          items:
            $ref: '#/components/schemas/URL'
          description: URL of a reference Web page that unambiguously indicates the item's identity
        datePublished:
          type: string
          format: iso-8601
          example: '2022-12-14T15:35:48Z'
          description: 'The date the Event first appeared in ISO 8601 date format [[docs](https://en.wikipedia.org/wiki/ISO_8601)]

            \

            Please note that ''datePublished'' may not be provided for all Schemas that include `Thing` (e.g. `Organization`)

            '
        dateModified:
          type: string
          format: iso-8601
          example: '2022-12-14T03:41:20Z'
          description: 'The date the Event was last updated in ISO 8601 date format [[docs](https://en.wikipedia.org/wiki/ISO_8601)]

            \

            Please note that ''dateModified'' may not be provided for all Schemas that include `Thing` (e.g. `Organization`).

            \

            Indexing timestamps for Concert / Festival / Stream / MusicGroup / MusicVenue live on `datePublished` and `dateModified`. The sibling `x-createdOnDate` and `x-updatedOnDate` fields are scoped to data-source / `Organization` responses (e.g. ticket vendors, performance-rights organizations) and are not present on Event-derived schemas.

            '
    Stream:
      title: Stream
      description: A stream
      type: object
      required:
      - '@type'
      - name
      - identifier
      - url
      - eventStatus
      - startDate
      - location
      - performer
      allOf:
      - $ref: '#/components/schemas/Event'
      - type: object
        properties:
          '@type':
            type: string
            enum:
            - Stream
          deletionStatus:
            $ref: '#/components/schemas/propDeletionStatus'
          deletedAt:
            $ref: '#/components/schemas/propDeletedAt'
          mergedInto:
            $ref: '#/components/schemas/propMergedInto'
          isLiveBroadcast:
            type: boolean
            description: True if the broadcast is of a live event
          broadcastOfEvent:
            type: array
            items:
              oneOf:
              - $ref: '#/components/schemas/Concert'
              - $ref: '#/components/schemas/Festival'
          x-customTitle:
            type: string
            description: To replace the default `event[name]` property
      x-stoplight:
        id: fijmf4s5a9h9x
    Request:
      title: Request
      description: Enclosure for request details.
      type: object
      properties:
        endpoint:
          type: string
          format: url
          description: The base endpoint requested
        method:
          type: string
          description: The request method (e.g. GET, POST)
        params:
          type: array
          items: {}
          format: string
          description: The parameters for the request
        ip:
          oneOf:
          - type: string
            format: ipv4
          - type: string
            format: ipv6
          description: The requesting IP address, IPv4 or IPv6
        userAgent:
