          - $ref: '#/components/schemas/enumArtistDataSource'
          - $ref: '#/components/schemas/enumVenueDataSource'
        identifier:
          type: string
          description: The unique identifier of the item from the third-party source.
      examples:
      - '@type': ExternalIdentifier
        source: ticketmaster
        identifier: e3asdf3ad
      - '@type': ExternalIdentifier
        source: axs
        identifier: '123423'
    enumEventStatus:
      type: string
      description: 'The scheduling status of a live event. This is separate from `deletionStatus`, which appears only on tombstone rows:

        - `scheduled` — expected to happen at the current `startDate`; show normally.

        - `postponed` — delayed with no confirmed replacement date yet; keep the row, label it postponed, and avoid promising the current date.

        - `rescheduled` — moved to a confirmed new date; keep the row, update the date, and use `previousStartDate` when present.

        - `cancelled` — will not take place as scheduled but remains a live catalog row; keep it for history and joins, then hide it or clearly label it in upcoming views.


        Always persist `eventStatus` on upsert. None of these values means the row was removed from the catalog.

        '
      enum:
      - scheduled
      - postponed
      - rescheduled
      - cancelled
      x-tags:
      - Enums
