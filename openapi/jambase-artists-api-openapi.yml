      description: A successful response.
      type: boolean
      default: true
    propDeletionStatus:
      title: propDeletionStatus
      type: string
      enum:
      - deleted
      - trashed
      - merged
      example: deleted
      description: 'Present ONLY on tombstone rows returned by delta polls of currently sourced core feeds (requests that include `dateModifiedFrom`). This removal discriminator is separate from the live scheduling field `eventStatus`:

        - `deleted` — permanently removed; drop the cached row.

        - `trashed` — soft-deleted (events only; not an `eventStatus`). Treat the same as `deleted` and drop the cached row.

        - `merged` — folded into another record; repoint cached references to `mergedInto`.


        A tombstone row carries only `@type`, `identifier`, `deletionStatus`, `deletedAt`, `dateModified`, and (when `merged`) `mergedInto`. Tombstones count toward `perPage` and `pagination.totalItems` and are appended after live rows. For `deleted` / `trashed`, retention is 90 days from the visible-at `dateModified`; `merged` tombstones never expire. `deletedAt` is the true removal time and can be earlier than `dateModified` after a delayed backfill. Queries without `dateModifiedFrom` never return tombstones. Current source coverage: events (`deleted`, `trashed`, `merged`), festivals (`deleted`), artists / venues / festival collections (`merged`), and no stream tombstones.

        '
    enumAttendanceMode:
      type: string
      default: offline
      description: Indicates whether it occurs online, offline, or a mix.
      enum:
      - mixed
      - offline
      - online
      x-tags:
      - Enums
  parameters:
    expandPastEventsParam:
      in: query
      name: expandPastEvents
      description: 'Use `true` to explicitly request past/historical `Concert` and `Festival` objects.

        \

        On entity-scoped historical access, including standard Pro, combine it with one of the six accepted scope selectors: `artistId`, `artistSlug`, `artistName`, `venueId`, `venueSlug`, or `venueName`. Requests without a scope selector are denied with a 403 explaining how to correct the request. An explicit all-scope entitlement removes that gateway scope requirement, but the request remains subject to endpoint validation and its independent historical window.

        \

        Note: `dateModifiedFrom` is a modification-date filter, not an entity scope or request for history, and cannot substitute for a scope selector.

        \

        Availability is tiered by plan: Trial and the free MCP plan get a rolling 1-year window, Pro a rolling 3-year window (artist/venue lookups only), and Pro+ and Enterprise include all-scope access with the full archive. Scope and time window are independent contract dimensions: a per-subscription all-scope grant widens which queries may use history but does not change that subscription''s historical window.

        \

        On plans with geo + historical search (Enterprise baseline, or granted by request), a licensed past event-date window together with any geo parameter such as `geoCountryIso2` is sufficient, with no expand flag needed. This flag is also accepted as explicit historical intent on an entitled geo request. Geo filters alone return normal upcoming events. When an authorized historical request omits its lower event-date bound, the gateway forwards its effective fixed-plus-rolling historical floor before fetching; truly unlimited history receives no invented floor.

        '
      schema:
        type: boolean
        default: false
    datePublishedFromParam:
      in: query
      name: datePublishedFrom
      description: 'Must have been first published on or after this dateTime in GMT.\

        \

        If left blank or omitted, will use all first published on dates.


        - datePublishedFrom=2022-01-01 00:00:00


        Note: Use <a href="https://www.rfc-editor.org/rfc/rfc3339#section-5.6">RFC3339</a> format for parameter values.

        '
      example: '2022-01-01 00:00:00'
      schema:
        type: string
        format: rfc3339
    artistNameParam:
      in: query
      name: artistName
      description: 'A keyword-based search for artist name(s).

        - artistName=Billie%20Eilish


        Use a pipe (|) to include multiple artist names.

        - artistName=Billie%20Eilish|Lucy%20Dacus


        Keywords should be URL Encoded.\

        For more precise artist-specific results try using `artistId` or `artist[slug]`.


        Please note that `artistName` cannot be used togehter with `artistId` type searches and will be ignored if `artistId` is provided.

        '
      example: Billie Eilish
      schema:
        type: string
    dateModifiedFromParam:
      in: query
      name: dateModifiedFrom
      description: 'Must have been updated on or after this dateTime in GMT.\

        If left blank or omitted, will use all updated on dates


        - dateModifiedFrom=2022-10-31 00:00:00


        On its own, a `dateModifiedFrom` sweep only returns events whose dates have not yet passed — modifications to past-dated events never appear in a plain delta sweep. To catch changes to past shows, plans with geo + historical search (Enterprise baseline, or granted by request) can combine `dateModifiedFrom` with a geo parameter (such as `geoCountryIso2`) and an explicit past `eventDateFrom`/`eventDateTo` range. Two caveats: the historical index refreshes on a delay (up to about a day), so overlap historical watermarks by 24-48 hours; and a response carrying the `X-JBD-Geo-Historical-Fallback` header was served without past events and should be re-run after the UTC day resets.


        Note: Use <a href="https://www.rfc-editor.org/rfc/rfc3339#section-5.6">RFC3339</a> format for parameter values.

        '
      example: '2022-10-31 00:00:00'
      schema:
        type: string
        format: rfc3339
    genreSlugParam:
      in: query
      name: genreSlug
      description: 'Restrict results to a genre.

        - genreSlug=bluegrass


        Use a pipe (|) to include results from multiple genres.

        - genreSlug=bluegrass|blues

        '
      schema:
        $ref: '#/components/schemas/enumGenres'
    perPageParam:
      in: query
      name: perPage
      description: Number of events per page of results
      required: false
      schema:
        type: integer
        default: 40
        minimum: 1
        maximum: 100
    artistIdParam:
      in: query
      name: artistId
      description: "The source and unique identifier for the artist(s).\\\n\\\nFor example to search for LCD Soundsystem events:\n\n- artistId=jambase:228924\n\nUse a pipe (|) to include multiple artist IDs.\\\n\\\nFor example to search for LCD Soundsystem & Khalid events:\n- artistId=jambase:228924|jambase:3074545\n\nTo use non-JamBase data sources, use the ArtistDataSource [[enum](#)] for the ID(s) you are using.\\\n\\\nFor example to search for LCD Soundsystem events using their Ticketmaster ID:\n  - artistId=ticketmaster:K8vZ9175st0\n"
      schema:
        type: string
        example: jambase:228924
    expandExternalIdentifiersParam:
      in: query
      name: expandExternalIdentifiers
      description: 'Use `true` to include external IDs for `Concert`, `Artist`, and `Venue` objects.

        \

        Note: `expandExternalIdentifiers` is included on Startup and higher plans and on Trial. Looking up a record by a third-party ID (for example `/v3/artists/id/spotify:{id}`) works on every plan; see [Reverse ID Lookup](https://data.jambase.com/api/docs/reverse-id-lookup).

        '
      schema:
        type: boolean
        default: false
    excludeEventPerformersParam:
      in: query
      name: excludeEventPerformers
      description: 'Use `true` to suppress the `performer` node in `Concert` and `Festival` objects.

        '
      schema:
        type: boolean
        default: false
    expandArtistSameAsParam:
      in: query
      name: expandArtistSameAs
      description: 'Use `true` to include `sameAs` (i.e. links) for `Artist` responses.

        \

        Note: `expandArtistSameAs` is included on Startup and higher plans and on Trial. Looking up a record by a third-party ID (for example `/v3/artists/id/spotify:{id}`) works on every plan; see [Reverse ID Lookup](https://data.jambase.com/api/docs/reverse-id-lookup).

        '
      schema:
        type: boolean
        default: false
    pageParam:
      in: query
      name: page
      description: Page number of results to retrieve
      required: false
      schema:
        type: integer
        default: 1
