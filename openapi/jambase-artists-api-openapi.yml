      description: 'The true upstream time when the record left the catalog, in ISO 8601. Present only on tombstone rows. This can be earlier than `dateModified` after a delayed backfill: `dateModified` is the later visible-at timestamp used for delta matching, ordering, and `deleted` / `trashed` retention.

