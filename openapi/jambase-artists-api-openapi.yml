            description: For bands, an array of the band's members
            items:
              type: object
              properties:
                type:
                  type: string
                  enum:
                  - MusicGroup
                name:
                  type: string
                  description: The name of the item
                identifier:
                  type: string
                  example: jambase:12345
                  description: A unique identifier of the item
                image:
                  type: string
                  format: uri
                  description: An image of the item
                url:
                  type: string
                  format: uri
                  description: URL of the item
          memberOf:
            type: array
            description: For musicians, an array of the band's the musician is a member of
            items:
              type: object
              properties:
                '@type':
                  type: string
                  enum:
                  - MusicGroup
                name:
                  type: string
                  description: The name of the item
                identifier:
                  type: string
                  example: jambase:98765
                  description: A unique identifier of the item
                image:
                  type: string
                  format: uri
                  description: An image of the item
                url:
                  type: string
                  format: uri
                  description: URL of the item
          foundingLocation:
            type: object
            properties:
              '@type':
                type: string
                enum:
                - Place
              name:
                type: string
                example: Chicago, IL
            description: The hometown of the artist
          foundingDate:
            type: string
            format: iso-8601
            example: '1983'
            description: The year the artist first performed
          genre:
