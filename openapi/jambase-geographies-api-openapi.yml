        '
      schema:
        $ref: '#/components/schemas/enumState'
    geoLatitudeParam:
      in: query
      name: geoLatitude
      description: 'The latitude for geographic radius.

        - geoLatitude=40.7505

        '
      schema:
        $ref: '#/components/schemas/propLatitude'
    geoMetroIdParam:
      in: query
