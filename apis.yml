aid: jambase
url: https://raw.githubusercontent.com/api-evangelist/jambase/refs/heads/main/apis.yml
name: JamBase
description: >-
  JamBase is a live music data platform with over 25 years of concert history, providing access
  to 5M+ performances, 616K+ artist profiles, 91K+ venues, and 20K+ festivals. Their REST API
  delivers real-time global show listings, festival schedules, artist metadata, venue details,
  and ticket pricing data. JamBase Data is trusted by Google, Spotify, and 450+ companies for
  jam band and concert discovery, setlist information, tour dates, and live music event data.
accessModel:
  pricing: freemium
  onboarding: open
  trial: true
  try_now: true
  public: true
  label: Freemium (free trial) · Open access
