apis:
  - aid: jambase:jambase-data-api
    name: JamBase Data API
    description: >-
      The JamBase Data API provides REST access to the world's most comprehensive live music
      database with 25+ years of concert history. The v3 API covers events, artists, venues,
      festivals, and setlists with normalized data. Features include real-time event status
      updates (rescheduled, cancelled, postponed), third-party ID matching across 12 platforms
      including Spotify, MusicBrainz, Ticketmaster, and SeatGeek, plus historical event data
      dating back to 1999. Authentication uses Bearer token (API key) in the Authorization header.
