reconciled: true
tags:
  - Concerts
  - Events
  - FinOps
  - FOCUS
  - Live Music
description: >-
  FOCUS-aligned FinOps for the JamBase Data API: tiered subscription billing with per-call
  overage charges. The free Developer plan (1,000 calls/month) and paid tiers (Startup at
  $500/month, Pro at $1,500/month, Pro+ at $2,500/month) each carry distinct overage rates
  ($0.05, $0.04, $0.03, $0.02 per call respectively). Enterprise terms are custom. A 20%
  annual prepayment discount applies to all paid tiers.
sources:
  - https://data.jambase.com/pricing
  - https://data.jambase.com/api/docs/getting-started
  - https://focus.finops.org/focus-specification/v1-3/
notes: >-
  JamBase bills monthly subscriptions plus overage. FinOps focus is on tracking monthly
  call consumption against the plan quota to predict overage costs, and on choosing the
  right plan tier based on actual API usage volume.
