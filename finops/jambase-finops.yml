meters:
  - name: api_requests
    unit: request
    aggregation: sum
    dimensions:
      - api_key
      - endpoint
      - plan_tier
  - name: monthly_subscription
    unit: subscription
    aggregation: sum
    dimensions:
      - plan_tier
      - billing_cycle
  - name: overage_requests
    unit: request
    aggregation: sum
    dimensions:
      - api_key
      - plan_tier
principles:
  - name: Visibility
    description: Track per-key monthly call consumption against plan quota. Monitor usage
      throughout the billing cycle to anticipate overage charges before they accumulate.
  - name: Allocation
    description: Issue distinct API keys per consuming application or environment so API
      call costs and quota burn can be attributed to specific product teams or use cases.
  - name: Optimization
    description: Cache event, artist, and venue lookups aggressively to reduce redundant
      API calls. Use geographical and date filters to fetch only needed data. Consider the
      annual billing option for a 20% cost reduction on predictable usage volumes.
  - name: Accountability
    description: Designate an owner responsible for the JamBase developer account, plan
      tier selection, quota increase requests, and monitoring overage spend. Right-size the
      plan tier based on rolling 3-month actual usage to avoid chronic overages or
      over-provisioning.
  - name: Planning
    description: Calculate break-even points between plan tiers using overage rates. For
      example, a Startup plan with consistent overages beyond 37,500 additional calls/month
      would cost more than upgrading to Pro. Model projected growth in API consumption
      when selecting annual plan commitments.
